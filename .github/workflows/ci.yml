name: CI

on:
    push:
    pull_request:

jobs:
    build-and-test:
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [ubuntu-latest, macos-latest]
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Install clang-tidy (Ubuntu)
              if: runner.os == 'Linux'
              run: sudo apt-get update && sudo apt-get install -y clang clang-tidy ninja-build

            - name: Install LLVM, Ninja, and configure path (macOS)
              if: runner.os == 'macOS'
              run: |
                  brew list ninja >/dev/null 2>&1 || brew install ninja
                  brew list llvm >/dev/null 2>&1 || brew install llvm
                  LLVM_PREFIX="$(brew --prefix llvm)"
                  echo "$LLVM_PREFIX/bin" >> "$GITHUB_PATH"

            - name: Configure (Debug, sanitizers)
              run: cmake --preset debug

            - name: Build (Debug, sanitizers)
              run: cmake --build --preset debug

            - name: Lint (clang-tidy)
              run: cmake --build --preset debug --target tidy

            - name: Test (Debug, sanitizers)
              run: ctest --preset debug --output-on-failure

            - name: Configure (Release)
              run: cmake --preset release

            - name: Build (Release)
              run: cmake --build --preset release

            - name: Benchmark smoke test (Release)
              run: ./out/build/release/benchmarks/forest-sorting-bench

            - name: Test (Release)
              run: ctest --preset release --output-on-failure
