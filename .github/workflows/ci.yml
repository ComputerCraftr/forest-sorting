name: CI

on:
    push:
    pull_request:

jobs:
    format:
        runs-on: ubuntu-26.04
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Install formatters
              run: |
                  sudo apt-get update
                  sudo apt-get install -y clang-format-22 pipx

            - name: Check C++ formatting
              run: |
                  git ls-files -z '*.cpp' '*.cc' '*.cxx' '*.hpp' '*.hh' '*.h' \
                    | xargs -0 clang-format-22 --dry-run --Werror

            - name: Check CMake formatting
              run: |
                  git ls-files -z ':(glob)**/CMakeLists.txt' '*.cmake' \
                    | xargs -0 pipx run --spec cmakelang==0.6.13 cmake-format --check

    build-and-test:
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [ubuntu-26.04, macos-latest]
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Install clang-tidy (Ubuntu)
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y clang-22 clang-tidy-22 clang-tools-22 ninja-build

            - name: Install LLVM, Ninja, and configure path (macOS)
              if: runner.os == 'macOS'
              run: |
                  brew list ninja >/dev/null 2>&1 || brew install ninja
                  brew list llvm >/dev/null 2>&1 || brew install llvm
                  LLVM_PREFIX="$(brew --prefix llvm)"
                  echo "$LLVM_PREFIX/bin" >> "$GITHUB_PATH"

            - name: Configure (Debug, sanitizers)
              run: |
                  if [[ "$RUNNER_OS" == "Linux" ]]; then
                    cmake --preset debug \
                      -DCMAKE_CXX_COMPILER=clang++-22 \
                      -DFOREST_CLANG_TIDY="$(command -v clang-tidy-22)" \
                      -DFOREST_RUN_CLANG_TIDY="$(command -v run-clang-tidy-22)"
                  else
                    cmake --preset debug
                  fi

            - name: Build (Debug, sanitizers)
              run: cmake --build --preset build-debug

            - name: Lint (clang-tidy)
              run: cmake --build --preset build-debug --target tidy

            - name: Test (Debug, sanitizers)
              run: ctest --preset test-debug --output-on-failure

            - name: Configure (Release)
              run: |
                  if [[ "$RUNNER_OS" == "Linux" ]]; then
                    cmake --preset release -DCMAKE_CXX_COMPILER=clang++-22
                  else
                    cmake --preset release
                  fi

            - name: Build (Release)
              run: cmake --build --preset build-release

            - name: Benchmark smoke test (Release)
              run: ./out/build/release/benchmarks/forest-sorting-bench

            - name: Test (Release)
              run: ctest --preset test-release --output-on-failure

    gcc-warnings:
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Install Ninja
              run: sudo apt-get update && sudo apt-get install -y ninja-build

            - name: Configure (GCC warnings)
              run: cmake --preset gcc-warnings

            - name: Build (GCC warnings as errors)
              run: cmake --build --preset build-gcc-warnings

            - name: Test (GCC)
              run: ctest --preset test-gcc-warnings --output-on-failure
